<template>
    <lightning-card title="Lightning Record View form">
        <lightning-record-view-form
        object-api-name={objectApiName}
        record-id={recordId}
        >
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-2">
    <lightning-output-field field-name="Name"></lightning-output-field>
</div>
</div>
<div class="slds-grid slds-wrap">
    <div class="slds-col slds-size_1-of-2 slds-box">
        <lightning-output-field field-name="AccountNumber"></lightning-output-field>
        <lightning-output-field field-name="Site"></lightning-output-field>
        <lightning-output-field field-name="AccountSource"></lightning-output-field>
    </div>
    <div class="slds-col slds-size_1-of-2 slds-box">
        <lightning-output-field field-name="AnnualRevenue"></lightning-output-field>
        <lightning-output-field field-name="BillingAddress"></lightning-output-field>
        <lightning-output-field field-name="Contact_Count__c"></lightning-output-field>
        <lightning-output-field field-name="Description"></lightning-output-field>
    </div>
    <div class="slds-col slds-size_2-of-2 slds-box">
        <lightning-output-field field-name="Fax"></lightning-output-field>
        <lightning-output-field field-name="Industry"></lightning-output-field>
        <lightning-output-field field-name="Phone"></lightning-output-field>
        <lightning-output-field field-name="Rating"></lightning-output-field>
    </div>
  </div>
    </lightning-record-view-form>
    </lightning-card>
</template>
