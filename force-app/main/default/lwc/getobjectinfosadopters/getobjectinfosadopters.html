<template>
    <lightning-card title="GetObjectInfoes for multiple objects">
        <template if:true={resultdata}>
        <div class="slds-p-around_medium">
            <div>Case======> {casedata.apiName}</div>
            <div>Account======> {Accountdata.apiName}</div>
            <lightning-button label="Get Case Record types" onclick={getcaserecordtypes}></lightning-button>
            <template if:true={caserecordtypes}>
                <template for:each={caserecordtypes} for:item="recordtype">
                    <div key={recordtype.recordTypeId}>
                         {recordtype.name} ==>{recordtype.recordTypeId}
                    </div>
                </template>
            </template>
        </div>
    </template>
    </lightning-card>
</template>
