<template>
    <lightning-card title="Lightning Record Form view mode">
        <lightning-record-form
        object-api-name={objectApiName}
        fields={fields}
        onerror={handleerror} 
        onsuccess={handlesuccess}
        onsubmit={handleSubmit}
        
        ></lightning-record-form>
    </lightning-card>

    <lightning-card title="Lightning Record Form with compact layout">
        <lightning-record-form
        record-id="003J300000TsZKRIA3"
        object-api-name={objectApiName}
        layout-type="Compact"
        columns="2"
        mode="readonly"
        ></lightning-record-form>
    

    <lightning-record-form
    record-id="003J300000TsZKRIA3"
    object-api-name={objectApiName}
    fields={fields}
    columns="2"
    mode="view"
    onsubmit={manuplatesubmit}
    class="editform"
    density="compact"></lightning-record-form>
    
</lightning-card>
</template>
